<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مستجدات أبحاث طب الأسنان</title>
  <meta name="description" content="مختصر يومي لأحدث أبحاث طب الأسنان من PubMed">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="currentColor" opacity=".14"/><path d="M24 12.5c-3-2.3-9.5-2.4-11.3 3-1.4 4.4.9 8.2 2 12.3.9 3.3 1.2 7.7 3.6 7.7 2.6 0 2.4-6.2 5.7-6.2s3.1 6.2 5.7 6.2c2.4 0 2.7-4.4 3.6-7.7 1.1-4.100 3.400-7.900 2-12.300C33.500 10.100 27 10.200 24 12.500z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><h1>مستجدات أبحاث طب الأسنان</h1></div>
      <p class="sub">مختصر يومي لأحدث الأبحاث المنشورة في PubMed</p>

      <div class="tabs" role="tablist">
        <button id="tabDay" class="tab is-active" role="tab" aria-selected="true">أبحاث اليوم</button>
        <button id="tabSaved" class="tab" role="tab" aria-selected="false">المحفوظات <span id="savedCount" class="count"></span></button>
      </div>

      <div id="dateRow" class="date-row">
        <button id="olderBtn" class="ghost" aria-label="اليوم الأقدم">→ أقدم</button>
        <select id="dateSelect" aria-label="اختيار التاريخ"></select>
        <button id="newerBtn" class="ghost" aria-label="اليوم الأحدث">أحدث ←</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="notice" class="notice" hidden></div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="ابحث في العناوين والملخصات…" aria-label="بحث">
      <div id="chips" class="chips" aria-label="التخصصات"></div>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
    <section id="list" class="list"></section>
  </main>

  <footer class="foot wrap">
    <p>المصدر: PubMed (NCBI). الملخصات الآلية قد تحمل أخطاء؛ ارجع دائماً إلى المقال الأصلي قبل أي قرار سريري، وهذا الموقع لا يغني عن الحكم المهني.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
